<!-- Preconnect to third-party origins used on every page -->
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="dns-prefetch" href="https://www.google-analytics.com" />
<link rel="dns-prefetch" href="https://cdn.botpress.cloud" />

<!-- Botpress webchat (lazy-loaded to protect Core Web Vitals) -->
<script>
  (function () {
    var botpressLoaded = false;
    var botpressLoading = false;
    var idleLoadDelayMs = 3500;

    function loadScript(src, defer) {
      return new Promise(function (resolve, reject) {
        var script = document.createElement("script");
        script.src = src;
        if (defer) script.defer = true;
        script.onload = resolve;
        script.onerror = reject;
        document.head.appendChild(script);
      });
    }

    function loadBotpress() {
      if (botpressLoaded || botpressLoading) return;
      botpressLoading = true;

      loadScript("https://cdn.botpress.cloud/webchat/v3.7/inject.js", true)
        .then(function () {
          // Branded webchat config — mirrors bot fd2a9000 (brainworkup agent bot).
          // Palette: charcoal #34373f and logo yellow #f4e30c.
          window.botpress.init({
            botId: "e57af076-1a5b-44d8-aeba-f1ba3e5acffd",
            clientId: "ef1081c8-845a-4c83-a76a-063af5b4de7c",
            configuration: {
              botName: "BrainWorkup Assistant",
              botDescription: "Ask about our services, conditions we evaluate, or how to get in touch.",
              botAvatar: "https://brainworkup.org/favicon_black.webp",
              website: { title: "brainworkup.org", link: "https://brainworkup.org" },
              email: { title: "info@brainworkup.org", link: "mailto:info@brainworkup.org" },
              phone: { title: "(213) 495-1155", link: "tel:+12134951155" },
              color: "#34373f",
              variant: "solid",
              headerVariant: "solid",
              themeMode: "light",
              fontFamily: "inter",
              radius: 2,
              feedbackEnabled: false,
              soundEnabled: false,
              proactiveMessageEnabled: false,
              conversationHistory: false
            }
          });
          botpressLoaded = true;
          removeListeners();
        })
        .catch(function () {
          botpressLoading = false;
        });
    }

    function onFirstInteraction() {
      loadBotpress();
    }

    function addListeners() {
      window.addEventListener("scroll", onFirstInteraction, { passive: true, once: true });
      window.addEventListener("pointerdown", onFirstInteraction, { once: true });
      window.addEventListener("keydown", onFirstInteraction, { once: true });
      window.addEventListener("touchstart", onFirstInteraction, { passive: true, once: true });
    }

    function removeListeners() {
      window.removeEventListener("scroll", onFirstInteraction);
      window.removeEventListener("pointerdown", onFirstInteraction);
      window.removeEventListener("keydown", onFirstInteraction);
      window.removeEventListener("touchstart", onFirstInteraction);
    }

    function scheduleIdleLoad() {
      if ("requestIdleCallback" in window) {
        requestIdleCallback(function () {
          setTimeout(loadBotpress, idleLoadDelayMs);
        }, { timeout: 8000 });
      } else {
        setTimeout(loadBotpress, 8000 + idleLoadDelayMs);
      }
    }

    addListeners();

    if (document.readyState === "complete") {
      scheduleIdleLoad();
    } else {
      window.addEventListener("load", scheduleIdleLoad, { once: true });
    }
  })();

  // Quarto's search shortcut (f, /) checks document.activeElement — but the
  // Botpress webchat input lives inside a shadow DOM, so activeElement is the
  // host <div> while typing. Quarto then thinks no input is focused, opens the
  // Algolia overlay and steals the caret mid-sentence. Trap window.quartoOpenSearch
  // (assigned later by quarto-search.js) and no-op it while the chat has focus.
  (function () {
    function chatHasFocus() {
      var el = document.activeElement;
      if (!el) return false;
      if (el.classList && el.classList.contains("bpChatContainer")) return true;
      // version-drift fallback: focused shadow host containing the webchat composer
      if (el.shadowRoot && el.shadowRoot.querySelector(".bpComposerInput, textarea")) return true;
      return false;
    }
    var _openSearch = null;
    Object.defineProperty(window, "quartoOpenSearch", {
      configurable: true,
      get: function () {
        return function () {
          if (chatHasFocus()) return; // typing in webchat — don't steal focus to search
          if (_openSearch) return _openSearch();
        };
      },
      set: function (fn) {
        _openSearch = fn;
      }
    });
  })();
</script>

<!-- Botpress style overrides: friendlier teal brand, neutral header, soft input -->
<style>
  /* Widget variables and overrides (keeps defaults if classes change) */
  .bpw-widget,
  .bpw-app,
  .bpw-window {
    --bpw-accent: #34373f;
    /* charcoal brand color */
    --bpw-accent-contrast: #ffffff;
    --bpw-header-bg: #ffffff;
    --bpw-header-fg: #33373f;
    --bpw-input-bg: #f7f9f9;
    --bpw-border-radius: 12px;
  }

  /* Floating button */
  .bpw-floating-button {
    background: var(--bpw-accent) !important;
    color: var(--bpw-accent-contrast) !important;
    right: 24px !important;
    bottom: 24px !important;
    box-shadow: 0 6px 18px rgba(52, 55, 63, 0.18) !important;
  }

  /* Header and title */
  .bpw-header {
    background: var(--bpw-header-bg) !important;
    color: var(--bpw-header-fg) !important;
  }

  .bpw-header__title,
  .bpw-header__subtitle {
    color: var(--bpw-header-fg) !important;
  }

  /* Input area */
  .bpw-input,
  .bpw-send-button {
    background: var(--bpw-input-bg) !important;
  }

  /* Slightly round the chat window */
  .bpw-window,
  .bpw-wrapper {
    border-radius: 12px !important;
    overflow: hidden;
  }

  /* Make the Botpress attribution less visually intrusive */
  .bpw-botpress-badge {
    opacity: 0.7;
    color: #8f8f8f !important;
  }
</style>
